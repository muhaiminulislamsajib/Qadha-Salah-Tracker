name: Build and Publish Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Temporary Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK File
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Qadha-Salah-Tracker.apk

      - name: Create or Update 'latest' GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/debug/Qadha-Salah-Tracker.apk"
          tag: "latest"
          name: "Qadha Salah Tracker – Missed Islamic Prayer Tracker APK"
          body: |
            ## 🌙 Qadha Salah Tracker - Latest Release

            Download the official Android APK for **Qadha Salah Tracker**. Track Qadha Salah, missed prayers, prayer history, Qadha Waqt, and monitor your spiritual progress with an easy Islamic prayer tracker.

            ### 🚀 Key Features
            * Track daily missed prayers (Qadha Umri & Qadha Waqt).
            * Detailed prayer history logs and calculation progress.
            * Lightweight and privacy-focused Android application.

            ---
            * **File Name:** `Qadha-Salah-Tracker.apk`
            * **Build Status:** Updated automatically on every commit to `main`.
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
